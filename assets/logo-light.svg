<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" fill="none" role="img" aria-label="aws-cost-audit, read-only by default, live pricing">
  <defs>
    <linearGradient id="a-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#AB6600"/>
      <stop offset="100%" stop-color="#EB0054"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="a-mark" gradientUnits="userSpaceOnUse" x1="-60" y1="-42" x2="58" y2="50">
      <stop offset="8%" stop-color="#AB6600"/>
      <stop offset="92%" stop-color="#EB0054"/>
    </linearGradient>

    <linearGradient id="a-horizon" gradientUnits="userSpaceOnUse" x1="36" y1="164" x2="684" y2="164">
      <stop offset="0%" stop-color="#AB6600" stop-opacity="0"/>
      <stop offset="22%" stop-color="#AB6600" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#A836FF" stop-opacity="0.55"/>
      <stop offset="82%" stop-color="#EB0054" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="a-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="164" x2="0" y2="190">
      <stop offset="0%" stop-color="#AB6600" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#A836FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0.05"/>
    </linearGradient>

    <clipPath id="a-gridclip">
      <rect x="10" y="164" width="700" height="26"/>
    </clipPath>

  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .tag { font-size: 12.5px; letter-spacing: 1.6px; fill: #48546B; }

    @keyframes a-flowdash { to { stroke-dashoffset: -240; } }
    .flowline { animation: a-flowdash 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="200" fill="#F7F8FB"/>
  <rect x="10" y="10" width="700" height="180" rx="16" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1"/>

  <!-- perspective grid below the horizon, off by default -->
  <g id="grid" clip-path="url(#a-gridclip)" opacity="0">
    <g stroke="url(#a-gridfade)" stroke-width="1" fill="none">
      <path d="M360 164 L-540 190"/><path d="M360 164 L-160 190"/><path d="M360 164 L60 190"/>
      <path d="M360 164 L190 190"/><path d="M360 164 L280 190"/><path d="M360 164 L360 190"/>
      <path d="M360 164 L440 190"/><path d="M360 164 L530 190"/><path d="M360 164 L660 190"/>
      <path d="M360 164 L880 190"/><path d="M360 164 L1260 190"/>
    </g>
    <g stroke="url(#a-gridfade)" stroke-width="1" fill="none">
      <line x1="10" y1="167" x2="710" y2="167"/>
      <line x1="10" y1="171" x2="710" y2="171"/>
      <line x1="10" y1="177" x2="710" y2="177"/>
      <line x1="10" y1="186" x2="710" y2="186"/>
    </g>
  </g>

  <line x1="36" y1="164" x2="684" y2="164" stroke="url(#a-horizon)" stroke-width="1.1" opacity="0.9"/>
  <line class="flowline" x1="36" y1="164" x2="684" y2="164" stroke="url(#a-horizon)" stroke-width="1.1" stroke-dasharray="3 9" opacity="0.8"/>

  <!-- mark: a curve bending downward over a coin edge -->
  <g transform="translate(96,100)">
    <path d="M 41.2 35.7 A 30 30 0 0 1 -13.2 35.7" stroke="url(#a-mark)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.5"/>
    <circle cx="14" cy="18" r="30" fill="url(#a-mark)" opacity="0.10"/>
    <circle cx="14" cy="18" r="30" stroke="url(#a-mark)" stroke-width="3.2" fill="none"/>
    <circle cx="14" cy="18" r="21" stroke="url(#a-mark)" stroke-width="1.5" fill="none" opacity="0.45"/>
    <path d="M -60 -42 C -30 -42, -16 -20, -2 6 C 10 28, 30 42, 56 48"
          stroke="url(#a-mark)" stroke-width="4.4" fill="none" stroke-linecap="round"/>
    <circle cx="56" cy="48" r="4.4" fill="url(#a-mark)"/>
  </g>

  <text class="disp" x="180" y="104" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#a-brand)">aws-cost-audit</text>
  <text class="mono tag" x="182" y="140">read-only by default  ·  live pricing</text>

</svg>
