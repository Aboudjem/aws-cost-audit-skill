<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none" role="img" aria-label="aws-cost-audit: a savings plan you can check. Every number checked against live AWS pricing. Nothing deleted without your say-so.">
  <defs>
    <linearGradient id="a-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="a-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="a-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB341"/>
      <stop offset="34%" stop-color="#FF4D8D"/>
      <stop offset="70%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="a-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFB341"/>
      <stop offset="100%" stop-color="#FF4D8D"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="a-rule" gradientUnits="userSpaceOnUse" x1="568" y1="112" x2="568" y2="292">
      <stop offset="0%" stop-color="#FFB341" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFB341" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="a-horizon" gradientUnits="userSpaceOnUse" x1="60" y1="332" x2="1140" y2="332">
      <stop offset="0%" stop-color="#FFB341" stop-opacity="0"/>
      <stop offset="22%" stop-color="#FFB341" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="82%" stop-color="#FF2D78" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="a-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="332" x2="0" y2="400">
      <stop offset="0%" stop-color="#FFB341" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C77DFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="a-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="a-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="a-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="a-glow-atmo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="a-sunclip">
      <circle cx="1096" cy="268" r="64"/>
    </clipPath>

    <clipPath id="a-gridclip">
      <rect x="0" y="332" width="1200" height="68"/>
    </clipPath>

    <clipPath id="a-wordclip">
      <text x="64" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="68" font-weight="800" letter-spacing="-2">aws-cost-audit</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #FFB341; }
    .head    { font-size: 34px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.5px; }
    .sub     { font-size: 16px; font-weight: 500; fill: #B6C2DA; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #8494B0; }

    @keyframes a-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: a-breathe 9s ease-in-out infinite; }

    @keyframes a-sunpulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.62; } }
    .sun { animation: a-sunpulse 10s ease-in-out infinite; }

    @keyframes a-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: a-flow 14s linear infinite; }

    @keyframes a-pip { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: a-pip 5s ease-in-out infinite 0s; }
    .d2 { animation: a-pip 5s ease-in-out infinite 0.35s; }
    .d3 { animation: a-pip 5s ease-in-out infinite 0.7s; }
    .d4 { animation: a-pip 5s ease-in-out infinite 1.05s; }
    .d5 { animation: a-pip 5s ease-in-out infinite 1.4s; }

    @keyframes a-sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(700px); }
      100% { transform: translateX(700px); }
    }
    .sheen { animation: a-sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="400" fill="url(#a-ground)"/>
  <ellipse class="bloom" cx="600" cy="404" rx="720" ry="190" fill="url(#a-bloom)"/>

  <!-- sun disc, sitting on the horizon at the right, behind everything -->
  <g class="sun">
    <g filter="url(#a-glow-atmo)">
      <circle cx="1096" cy="268" r="64" fill="url(#a-sun)"/>
    </g>
    <g clip-path="url(#a-sunclip)" fill="#080C16">
      <rect x="1024" y="278" width="144" height="3"/>
      <rect x="1024" y="288" width="144" height="4"/>
      <rect x="1024" y="299.5" width="144" height="5.5"/>
      <rect x="1024" y="313" width="144" height="7.5"/>
      <rect x="1024" y="329" width="144" height="10"/>
    </g>
  </g>

  <!-- perspective grid below the horizon, off by default -->
  <g id="grid" clip-path="url(#a-gridclip)" opacity="0">
    <g stroke="url(#a-gridfade)" stroke-width="1" fill="none">
      <path d="M600 332 L-1180 400"/><path d="M600 332 L-560 400"/><path d="M600 332 L-190 400"/>
      <path d="M600 332 L40 400"/>   <path d="M600 332 L200 400"/>  <path d="M600 332 L320 400"/>
      <path d="M600 332 L415 400"/>  <path d="M600 332 L490 400"/>  <path d="M600 332 L548 400"/>
      <path d="M600 332 L600 400"/>
      <path d="M600 332 L652 400"/>  <path d="M600 332 L710 400"/>  <path d="M600 332 L785 400"/>
      <path d="M600 332 L880 400"/>  <path d="M600 332 L1000 400"/> <path d="M600 332 L1160 400"/>
      <path d="M600 332 L1390 400"/> <path d="M600 332 L1760 400"/> <path d="M600 332 L2380 400"/>
    </g>
    <g stroke="url(#a-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="335" x2="1200" y2="335"/>
      <line x1="0" y1="339.5" x2="1200" y2="339.5"/>
      <line x1="0" y1="345.5" x2="1200" y2="345.5"/>
      <line x1="0" y1="353.5" x2="1200" y2="353.5"/>
      <line x1="0" y1="364" x2="1200" y2="364"/>
      <line x1="0" y1="378" x2="1200" y2="378"/>
      <line x1="0" y1="396" x2="1200" y2="396"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="60" y1="332" x2="1140" y2="332" stroke="url(#a-horizon)" stroke-width="1.25"/>
    <line class="flowline" x1="60" y1="332" x2="1140" y2="332" stroke="url(#a-horizon)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <g filter="url(#a-glow)">
    <text class="disp" x="64" y="230" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#a-brand)">aws-cost-audit</text>
  </g>

  <g clip-path="url(#a-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-200" y="140" width="110" height="130" fill="url(#a-sheen)" opacity="0.7"/>
    </g>
  </g>

  <line x1="568" y1="112" x2="568" y2="292" stroke="url(#a-rule)" stroke-width="1.5"/>

  <g transform="translate(608,0)">
    <text class="mono eyebrow" x="0" y="140">AWS BILL AUDIT SKILL</text>
    <text class="disp head" x="0" y="192">A savings plan you can check</text>
    <text class="disp sub" x="0" y="226">Every number checked against live AWS pricing.</text>
    <text class="disp sub" x="0" y="250">Nothing deleted without your say-so.</text>

    <g transform="translate(0,288)">
      <g class="d1"><circle cx="0" cy="0" r="4.5" fill="#FFB341" filter="url(#a-glow-sm)"/></g>
      <g class="d2"><circle cx="22" cy="0" r="4.5" fill="#FF4D8D" filter="url(#a-glow-sm)"/></g>
      <g class="d3"><circle cx="44" cy="0" r="4.5" fill="#FF2D78" filter="url(#a-glow-sm)"/></g>
      <g class="d4"><circle cx="66" cy="0" r="4.5" fill="#C77DFF" filter="url(#a-glow-sm)"/></g>
      <g class="d5"><circle cx="88" cy="0" r="4.5" fill="#8E7BFF" filter="url(#a-glow-sm)"/></g>
      <text class="mono tag" x="114" y="4">EVIDENCE FIRST</text>
    </g>
  </g>

  <text class="mono tag" x="64" y="318" opacity="0.85">read-only by default  ·  live pricing  ·  no deletes without confirm</text>
</svg>
