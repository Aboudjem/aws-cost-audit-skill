<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none" role="img" aria-label="aws-cost-audit: a savings plan you can check. Every number checked against live AWS pricing. Nothing deleted without your say-so.">
  <defs>
    <linearGradient id="a-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#AB6600"/>
      <stop offset="100%" stop-color="#EB0054"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="a-rule" gradientUnits="userSpaceOnUse" x1="568" y1="112" x2="568" y2="292">
      <stop offset="0%" stop-color="#AB6600" stop-opacity="0"/>
      <stop offset="45%" stop-color="#AB6600" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="a-horizon" gradientUnits="userSpaceOnUse" x1="64" y1="332" x2="1136" y2="332">
      <stop offset="0%" stop-color="#AB6600" stop-opacity="0"/>
      <stop offset="22%" stop-color="#AB6600" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#A836FF" stop-opacity="0.6"/>
      <stop offset="82%" stop-color="#EB0054" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="a-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="332" x2="0" y2="376">
      <stop offset="0%" stop-color="#AB6600" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#A836FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0.05"/>
    </linearGradient>

    <clipPath id="a-gridclip">
      <rect x="24" y="332" width="1152" height="44"/>
    </clipPath>

  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #AB6600; }
    .head    { font-size: 34px; font-weight: 700; fill: #07070C; letter-spacing: -0.5px; }
    .sub     { font-size: 16px; font-weight: 500; fill: #1A2233; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #48546B; }

    @keyframes a-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: a-flow 14s linear infinite; }

    @keyframes a-pip { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: a-pip 5s ease-in-out infinite 0s; }
    .d2 { animation: a-pip 5s ease-in-out infinite 0.35s; }
    .d3 { animation: a-pip 5s ease-in-out infinite 0.7s; }
    .d4 { animation: a-pip 5s ease-in-out infinite 1.05s; }
    .d5 { animation: a-pip 5s ease-in-out infinite 1.4s; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="400" fill="#F7F8FB"/>
  <rect x="24" y="24" width="1152" height="352" rx="20" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1"/>

  <!-- perspective grid below the horizon, off by default -->
  <g id="grid" clip-path="url(#a-gridclip)" opacity="0">
    <g stroke="url(#a-gridfade)" stroke-width="1" fill="none">
      <path d="M600 332 L-1180 376"/><path d="M600 332 L-560 376"/><path d="M600 332 L-190 376"/>
      <path d="M600 332 L40 376"/>   <path d="M600 332 L200 376"/>  <path d="M600 332 L320 376"/>
      <path d="M600 332 L415 376"/>  <path d="M600 332 L490 376"/>  <path d="M600 332 L548 376"/>
      <path d="M600 332 L600 376"/>
      <path d="M600 332 L652 376"/>  <path d="M600 332 L710 376"/>  <path d="M600 332 L785 376"/>
      <path d="M600 332 L880 376"/>  <path d="M600 332 L1000 376"/> <path d="M600 332 L1160 376"/>
      <path d="M600 332 L1390 376"/> <path d="M600 332 L1760 376"/> <path d="M600 332 L2380 376"/>
    </g>
    <g stroke="url(#a-gridfade)" stroke-width="1" fill="none">
      <line x1="24" y1="335" x2="1176" y2="335"/>
      <line x1="24" y1="339" x2="1176" y2="339"/>
      <line x1="24" y1="344" x2="1176" y2="344"/>
      <line x1="24" y1="351" x2="1176" y2="351"/>
      <line x1="24" y1="360" x2="1176" y2="360"/>
      <line x1="24" y1="372" x2="1176" y2="372"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="64" y1="332" x2="1136" y2="332" stroke="url(#a-horizon)" stroke-width="1.25"/>
    <line class="flowline" x1="64" y1="332" x2="1136" y2="332" stroke="url(#a-horizon)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <text class="disp" x="64" y="230" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#a-brand)">aws-cost-audit</text>

  <line x1="568" y1="112" x2="568" y2="292" stroke="url(#a-rule)" stroke-width="1.5"/>

  <g transform="translate(608,0)">
    <text class="mono eyebrow" x="0" y="140">AWS BILL AUDIT SKILL</text>
    <text class="disp head" x="0" y="192">A savings plan you can check</text>
    <text class="disp sub" x="0" y="226">Every number checked against live AWS pricing.</text>
    <text class="disp sub" x="0" y="250">Nothing deleted without your say-so.</text>

    <g transform="translate(0,288)">
      <g class="d1"><circle cx="0" cy="0" r="4.5" fill="#AB6600"/></g>
      <g class="d2"><circle cx="22" cy="0" r="4.5" fill="#EB0054"/></g>
      <g class="d3"><circle cx="44" cy="0" r="4.5" fill="#A836FF"/></g>
      <g class="d4"><circle cx="66" cy="0" r="4.5" fill="#725BFF"/></g>
      <g class="d5"><circle cx="88" cy="0" r="4.5" fill="#0B6DFF"/></g>
      <text class="mono tag" x="114" y="4">EVIDENCE FIRST</text>
    </g>
  </g>

  <text class="mono tag" x="64" y="318">read-only by default  ·  live pricing  ·  no deletes without confirm</text>
</svg>
